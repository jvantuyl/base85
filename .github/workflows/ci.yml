name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Format, compile & test
    runs-on: [self-hosted, build00]
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect ImageOS (self-hosted runner)
        run: |
          . /etc/os-release
          case "${ID}-${VERSION_ID}" in
            ubuntu-22.04) IMAGE_OS=ubuntu22 ;;
            *)            IMAGE_OS=ubuntu24 ;;
          esac
          echo "ImageOS=${IMAGE_OS}" >> "${GITHUB_ENV}"

      # Toolchain versions come from mise.toml. build00 is Debian, so tell mise
      # to use Bob's Ubuntu 24.04 OTP build instead of compiling from source.
      - name: Install toolchain with mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          MISE_ERLANG_PRECOMPILED_OS: ubuntu-24.04
        with:
          install_args: erlang elixir
          cache: false

      - name: Install hex & rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
